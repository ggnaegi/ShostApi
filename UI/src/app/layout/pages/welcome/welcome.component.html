@if (data(); as data) {
  <div class="main-content-container">
    <div class="left-section">
      <div class="welcome-title" id="welcome-section">
        <h1><span [innerHtml]="data.WelcomeText"></span></h1>
      </div>
      <div class="welcome-current-session">
        <div class="content-wrapper">
          <div class="year-card-wrapper">
            <mat-card class="year-card" [routerLink]="['/session']">
              <mat-card-header>
                <mat-card-title>{{ year }}</mat-card-title>
              </mat-card-header>
              <app-image-with-loading
                [src]="'assets/' + data.Picture"
                [class]="'card-logo'" />
            </mat-card>
          </div>
          <div class="welcome-teaser">
            <div [innerHTML]="data.Teaser"></div>
            <div class="redirect-link" [routerLink]="['/session']">
              <i class="fa fa-arrow-right"></i>
              <span>Plus d'informations sur les concerts...</span>
            </div>
          </div>
        </div>
      </div>
      <mat-card appearance="outlined" class="concerts-card">
        <mat-card-header>
          <mat-card-title>Représentations</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="concerts-container">
            @for (concert of data.Concerts; track concert) {
              <div class="concert-item">
                <h3>
                  <fa-icon [icon]="faCalendarAlt"></fa-icon>
                  {{ concert.Date | date: 'dd.MM.yyyy HH:mm' }}
                </h3>
                <ul class="concert-details">
                  <li>
                    <fa-icon [icon]="faBuilding"></fa-icon>
                    {{ concert.Venue }}
                  </li>
                  <li>
                    <fa-icon [icon]="faMapMarkerAlt"></fa-icon>
                    {{ concert.City }}
                  </li>
                  <li>
                    <a [href]="concert.Tickets" target="_blank">
                      <button
                        mat-raised-button
                        color="primary"
                        class="ticket-button">
                        <fa-icon
                          [icon]="faTicket"
                          style="color: white"></fa-icon>
                        Billets
                      </button>
                    </a>
                  </li>
                </ul>
              </div>
            }
          </div>
        </mat-card-content>
      </mat-card>
    </div>
    <div class="right-section"></div>
  </div>
} @else {
  <div class="main-content-container">
    <div class="left-section">
      <div class="welcome-title" id="welcome-section">
        <div
          class="skeleton-shimmer skeleton-line"
          style="width: 70%; height: 2.2rem"></div>
      </div>
      <div class="welcome-current-session">
        <div class="content-wrapper">
          <div class="year-card-wrapper">
            <mat-card class="year-card">
              <mat-card-header>
                <div
                  class="skeleton-shimmer skeleton-line"
                  style="width: 60px; height: 20px"></div>
              </mat-card-header>
              <div class="skeleton-shimmer skeleton-card-logo"></div>
            </mat-card>
          </div>
          <div class="welcome-teaser">
            <div
              class="skeleton-shimmer skeleton-line"
              style="width: 100%"></div>
            <div
              class="skeleton-shimmer skeleton-line"
              style="width: 90%"></div>
            <div
              class="skeleton-shimmer skeleton-line"
              style="width: 60%"></div>
          </div>
        </div>
      </div>
      <mat-card appearance="outlined" class="concerts-card">
        <mat-card-header>
          <div
            class="skeleton-shimmer skeleton-title"
            style="width: 220px"></div>
        </mat-card-header>
        <mat-card-content>
          <div class="concerts-container">
            @for (i of [1, 2]; track i) {
              <div class="concert-item">
                <div
                  class="skeleton-shimmer skeleton-line"
                  style="width: 80%; height: 20px; margin-bottom: 10px"></div>
                <div
                  class="skeleton-shimmer skeleton-line"
                  style="width: 70%"></div>
                <div
                  class="skeleton-shimmer skeleton-line"
                  style="width: 55%"></div>
                <div
                  class="skeleton-shimmer skeleton-button"
                  style="width: 100%; margin-top: 8px"></div>
              </div>
            }
          </div>
        </mat-card-content>
      </mat-card>
    </div>
    <div class="right-section">
      <div class="skeleton-shimmer skeleton-facebook-widget"></div>
    </div>
  </div>
}
