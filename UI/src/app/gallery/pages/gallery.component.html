@if (galleriesDefinitions()) {
  @if (mediaMode()) {
    <!-- Gallery page: image with a short teaser description on the right -->
    <div class="gallery-list" id="medias-section">
      @for (logo of displayedLogos(); track logo) {
        <mat-card
          class="gallery-row"
          [id]="'media-' + logo.year"
          [class.is-clickable]="logo.showGallery"
          (click)="onCardClick(logo)"
          (keydown.enter)="onCardClick(logo)"
          tabindex="0">
          <div class="gallery-row-image">
            <app-image-with-loading
              [src]="logo.url"
              [alt]="logo.alt"
              class="card-logo" />
          </div>
          <div class="gallery-row-info">
            <h3 class="gallery-row-year">{{ logo.year }}</h3>
            @if (logo.teaser) {
              <p class="gallery-row-teaser" [innerHTML]="logo.teaser"></p>
            }
            @if (logo.videoUrl) {
              <a
                class="gallery-row-video-link"
                [href]="logo.videoUrl"
                target="_blank"
                rel="noopener noreferrer"
                (click)="$event.stopPropagation()">
                <svg
                  class="youtube-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true">
                  <path
                    d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z" />
                </svg>
                Lien vers les vidéos
              </a>
            }
          </div>
        </mat-card>
      }
    </div>
  } @else {
    <!-- Session page: compact horizontal row of the most recent years -->
    <div class="card-container" id="medias-section">
      @for (logo of displayedLogos(); track logo) {
        <div class="year-card-wrapper">
          <mat-card
            class="year-card"
            [class.is-clickable]="logo.showPage"
            (click)="onCardClick(logo)"
            (keydown.enter)="onCardClick(logo)"
            tabindex="0">
            <mat-card-header>
              <mat-card-title>{{ logo.year }}</mat-card-title>
            </mat-card-header>
            <app-image-with-loading
              [src]="logo.url"
              [alt]="logo.alt"
              class="card-logo" />
            @if (logo.showGallery) {
              <mat-card-actions>
                <button
                  mat-icon-button
                  aria-label="Voir la galerie"
                  (click)="$event.stopPropagation(); openGalleryDialog(logo.year)">
                  <mat-icon svgIcon="photo-library"></mat-icon>
                </button>
              </mat-card-actions>
            }
          </mat-card>
        </div>
      }
    </div>
  }
}
