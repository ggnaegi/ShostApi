<div class="galleries-admin-container">
  <form class="media-texts-form" (ngSubmit)="saveMediaTexts()">
    <mat-form-field appearance="outline">
      <mat-label>Titre de la page Médias</mat-label>
      <input matInput name="mediaPageTitle" [(ngModel)]="mediaPageTitle" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Description de la page Médias (HTML autorisé)</mat-label>
      <textarea
        matInput
        name="mediaPageDescription"
        [(ngModel)]="mediaPageDescription"
        rows="4"></textarea>
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit">
      Enregistrer les textes
    </button>
  </form>

  <div class="add-gallery">
    <mat-form-field appearance="outline">
      <mat-label>Nouvelle année</mat-label>
      <input
        matInput
        type="number"
        [ngModel]="newYear()"
        (ngModelChange)="newYear.set($event)"
        placeholder="ex. 2027" />
    </mat-form-field>
    <button mat-raised-button color="primary" type="button" (click)="addGallery()">
      Ajouter une galerie
    </button>
  </div>

  <mat-accordion class="galleries-accordion">
    @for (item of items(); track item.logo.year) {
      <mat-expansion-panel class="form-expansion-panel">
        <mat-expansion-panel-header>
          <mat-panel-title>{{ item.logo.year }}</mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
          <app-gallery-item-admin
            [item]="item"
            [busy]="isBusy(item.logo.year)"
            (logoSaved)="logoSaved.emit($event)"
            (flyerSelected)="onFlyerSelected(item.logo.year, $event)"
            (imagesSelected)="onImagesSelected(item.logo.year, $event)"
            (imageDeleted)="onImageDeleted(item.logo.year, $event)" />
        </ng-template>
      </mat-expansion-panel>
    } @empty {
      <p class="galleries-empty">Aucune galerie pour le moment.</p>
    }
  </mat-accordion>
</div>
