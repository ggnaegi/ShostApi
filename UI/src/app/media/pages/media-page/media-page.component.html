<div class="media-page">
  <header class="media-page-header">
    <h1>Media</h1>
    <p class="media-page-subtitle">
      Galeries photos par année et dernières vidéos de l'Harmonie Shostakovich.
    </p>
  </header>

  <div class="media-page-layout">
    <aside class="media-sidebar">
      <app-media-navigation
        [years]="years()"
        [activeSection]="activeSection()"
        (navigate)="scrollToSection($event)"
      />
    </aside>

    <main class="media-content">
      <section class="media-section" aria-label="Archives photographiques">
        <app-gallery-container
          [mediaMode]="true"
          (knownYears)="years.set($event)"
        />
      </section>

      <section
        id="youtube"
        class="media-section"
        aria-label="Vidéos YouTube"
      >
        <div class="media-videos">
          <app-youtube-videos [maxThumbnails]="9" />
        </div>
      </section>
    </main>
  </div>
</div>
